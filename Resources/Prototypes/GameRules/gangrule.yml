- type: entity
  parent: BaseGameRule
  id: GangRule
  components:
  - type: GameRule # This makes it an actual game rule with standard timing / min player handling
    minPlayers: 0
    delay:
      min: 1 # seconds until it “fires” after round start
      max: 1
  - type: GangRule  #TODO THIS IS PROBABLY WHERE THE GANGDATA SHOULD BE STORED # Your custom rule logic component (C#) – like TraitorRule, RevolutionaryRule, etc.
  - type: AntagSelection # Antag selection: who becomes a gang member
    selectionTime: IntraPlayerSpawn   # or PrePlayerSpawn, copy what you want from other rules
    definitions:
    - prefRoles: [ GangMember ]       # this is their preference slot in character setup
      lateJoinAdditional: true        # allow assigning gang members to late-joiners if slots/ratio permit
      min: 1                          # ensure at least one gang member can exist even on low-pop rounds
      max: 8                          # max gang members
      playerRatio: 1                  # gangmember/player ratio TODO it makes more sense to define gangmember/inmates ratio
      blacklist:
        components:
        - AntagImmune
      mindRoles:
      - MindRoleGangMember            # your mind-role prototype ID
      requirements:
        jobs:
        - Inmate    # only inmates can be gang members (corrupt COs are linked to a gang, but are not Gang Members)
